services:
  - type: web
    name: ai-prospect-discovery
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 4000
      - key: ENVIRONMENT
        value: production
      - key: SEARCH_ENGINE
        value: duckduckgo
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
